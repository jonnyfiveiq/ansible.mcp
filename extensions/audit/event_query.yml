---
ansible.mcp.run_tool:
  query: >-
    . | select(.tool_name != null and .mcp_server != null) | {name: (.mcp_server + ":" + .tool_name), canonical_facts: {id: (.mcp_server + ":" + .tool_name)}, facts: {infra_type: "PrivateCloud", infra_bucket: "AI_MCP2", device_type: "Resource", mcp_server: .mcp_server, tool_name: .tool_name}}

ansible.mcp.server_info:
  query: >-
    .server_info | select(.serverInfo.name != null) | {name: .serverInfo.name, canonical_facts: {id: .serverInfo.name}, facts: {infra_type: "PrivateCloud", infra_bucket: "AI_MCP2", device_type: "MCP_Server"}}

ansible.mcp.tools_info:
  query: >-
    .tools[] | select(.name != null) | {name: .name, canonical_facts: {id: .name}, facts: {infra_type: "PrivateCloud", infra_bucket: "AI_MCP2", device_type: "MCP_Tool"}}
