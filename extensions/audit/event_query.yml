---
# ansible.mcp collection - Indirect Node Counting Queries

ansible.mcp.run_tool:
  query: >-
    . as $root | .content[] | .text | (fromjson)? | select(.id != null) | {
      name: (.id | tostring),
      canonical_facts: {
        id: (.id | tostring)
      },
      facts: {
        infra_type: "PrivateCloud2",
        infra_bucket: "AI_MCP2",
        device_type: "Resource",
        mcp_server: $root.mcp_server,
        tool_name: $root.tool_name
      }
    }

ansible.mcp.server_info:
  query: >-
    .server_info | select(.serverInfo.name != null) | {
      name: .serverInfo.name,
      canonical_facts: {
        id: .serverInfo.name
      },
      facts: {
        infra_type: "PrivateCloud2",
        infra_bucket: "AI_MCP2",
        device_type: "MCP_Server"
      }
    }

ansible.mcp.tools_info:
  query: >-
    .tools[] | select(.name != null) | {
      name: .name,
      canonical_facts: {
        id: .name
      },
      facts: {
        infra_type: "PrivateCloud2",
        infra_bucket: "AI_MCP2",
        device_type: "MCP_Tool"
      }
    }
